name: Release

# ADR-0001 (opcion D). Unico workflow del repo de fuentes.
# - pull_request: dry-run (construye lo nuevo, arma la db, no firma ni publica).
# - push a main en pkgbuilds/** o bin/** y workflow_dispatch: firma y publica a
#   gh-pages + release pkg-stable con GITHUB_TOKEN. Sin cron, sin rebase, sin
#   pushes a otros repos.
on:
  pull_request:
  push:
    branches: [main]
    paths: ['pkgbuilds/**', 'bin/**']
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = solo construir y validar"
        type: boolean
        default: false
      force_fail:
        description: "prueba ci-report: none | job | guard"
        type: choice
        options: [none, job, guard]
        default: none

permissions:
  contents: write
  issues: write

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          bash -n bin/release && bash -n bin/pin-omarchy && bash -n bin/prune-assets && bash -n .github/actions/ci-report/ci-report.sh
          [[ "${{ inputs.force_fail }}" != job ]] || { echo "::error::fallo forzado por workflow_dispatch (force_fail=job)"; exit 1; }
      - name: Dry-run
        if: github.event_name == 'pull_request' || inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_GUARD_FAIL: ${{ inputs.force_fail == 'guard' && '1' || '' }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          bin/release --out "$RUNNER_TEMP/out"
      - name: Checkout gh-pages
        if: github.event_name != 'pull_request' && !inputs.dry_run
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
      - name: Firmar y publicar
        if: github.event_name != 'pull_request' && !inputs.dry_run
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          PAGES_DIR: ${{ github.workspace }}/pages
          FORCE_GUARD_FAIL: ${{ inputs.force_fail == 'guard' && '1' || '' }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          [[ -n "$GPG_PRIVATE_KEY" ]] || { echo "::error::Falta el secret GPG_PRIVATE_KEY en este repo"; exit 1; }
          git -C pages config user.name "Roberto Flores"
          git -C pages config user.email "25asab015@ujmd.edu.sv"
          bin/release --publish --out "$RUNNER_TEMP/out"
      - name: Validar Pages
        if: github.event_name != 'pull_request' && !inputs.dry_run
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          base=https://robert-flo.github.io/omarchy-personal-repo/stable/x86_64
          want="$(tar -xOf "$RUNNER_TEMP/out/stable/x86_64/omarchy-personal.db" --wildcards '*/desc' | awk '/^%FILENAME%$/{getline;print}' | sort)"
          for i in $(seq 1 45); do
            got="$(curl -fsSL "$base/omarchy-personal.db" 2>/dev/null | tar -xOf - --zstd --wildcards '*/desc' 2>/dev/null | awk '/^%FILENAME%$/{getline;print}' | sort || true)"
            [[ "$got" == "$want" ]] && { echo "OK: Pages sirve la db nueva"; echo "$got"; exit 0; }
            sleep 20
          done
          echo "::error::Pages no sirve aun la db nueva"; exit 1
      - name: Limpiar assets viejos de pkg-stable
        if: github.event_name != 'pull_request' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exec > >(tee -a "$RUNNER_TEMP/ci.log") 2>&1
          bin/prune-assets "$RUNNER_TEMP/out/big.txt"
      - name: Resumen de error
        id: err
        if: always() && github.event_name != 'pull_request' && !inputs.dry_run
        run: |
          log="$RUNNER_TEMP/ci.log"
          if grep -q 'FAIL guard' "$log" 2>/dev/null; then echo "guard=failure" >> "$GITHUB_OUTPUT"
          elif [[ "${{ job.status }}" == success ]]; then echo "guard=success" >> "$GITHUB_OUTPUT"; fi
          { echo "text<<CIEOF"; grep -E '::error::|FAIL' "$log" 2>/dev/null | tail -n 40 || true; echo ---; tail -n 10 "$log" 2>/dev/null; echo CIEOF; } >> "$GITHUB_OUTPUT"
      - name: Reporte ci-failure (overlap-guard)
        if: always() && github.event_name != 'pull_request' && !inputs.dry_run && steps.err.outputs.guard != ''
        uses: ./.github/actions/ci-report
        with:
          workflow: overlap-guard
          status: ${{ steps.err.outputs.guard }}
          error: ${{ steps.err.outputs.text }}
      - name: Reporte ci-failure (release)
        if: always() && github.event_name != 'pull_request' && !inputs.dry_run && steps.err.outputs.guard != 'failure'
        uses: ./.github/actions/ci-report
        with:
          workflow: release
          status: ${{ job.status }}
          error: ${{ steps.err.outputs.text }}
